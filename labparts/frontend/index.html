<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabParts · Componentes do laboratório</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topo">
    <h1>LabParts</h1>
    <p>Controle de componentes eletrônicos do laboratório</p>
  </header>

  <div id="mensagem" class="mensagem" role="status" aria-live="polite"></div>

  <main class="layout">
    <section class="painel" aria-labelledby="titulo-form">
      <h2 id="titulo-form">Cadastrar componente</h2>
      <form id="form" novalidate>
        <input type="hidden" id="id">

        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" maxlength="100" required placeholder="Ex.: BMP280">

        <label for="categoria">Categoria</label>
        <select id="categoria" name="categoria" required></select>

        <label for="localizacao">Localização</label>
        <input id="localizacao" name="localizacao" type="text" maxlength="60" placeholder="Ex.: Gaveta B2">

        <label for="quantidade">Quantidade</label>
        <input id="quantidade" name="quantidade" type="number" min="0" step="1" required value="0">

        <label for="descricao">Descrição (opcional)</label>
        <textarea id="descricao" name="descricao" rows="3" maxlength="500" placeholder="Modelo, tensão, interface..."></textarea>

        <div class="acoes">
          <button type="submit" id="btn-salvar" class="primario">Cadastrar componente</button>
          <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="painel" aria-labelledby="titulo-lista">
      <div class="cabecalho-lista">
        <h2 id="titulo-lista">Componentes em estoque</h2>
        <div class="busca">
          <label for="busca">Buscar</label>
          <input id="busca" type="search" placeholder="Nome, categoria ou local">
        </div>
      </div>

      <div class="tabela-wrap">
        <table>
          <caption class="so-leitor">Lista de componentes cadastrados</caption>
          <thead>
            <tr>
              <th scope="col">Componente</th>
              <th scope="col">Categoria</th>
              <th scope="col">Local</th>
              <th scope="col" class="num">Qtd.</th>
              <th scope="col">Situação</th>
              <th scope="col">Ações</th>
            </tr>
          </thead>
          <tbody id="tabela"></tbody>
        </table>
      </div>
      <p id="vazio" class="vazio" hidden>Nenhum componente encontrado. Preencha o formulário para cadastrar o primeiro.</p>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
